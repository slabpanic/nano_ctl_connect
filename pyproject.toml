[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-ctl-connect"
version = "0.1.0"
description = "Python gRPC client for the nano_ctl motion-control backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["grpcio-tools==1.84.0"]
